name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Compile Reflex app
        run: reflex compile

  vercel-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Vercel image
        run: docker build -f Dockerfile.vercel -t prompt2music-vercel .

      - name: Start Vercel image
        run: docker run --rm -d --name prompt2music-vercel -e PORT=8080 -p 8080:8080 prompt2music-vercel

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/_health >/dev/null; then
              echo "Prompt2Music Vercel container is healthy."
              exit 0
            fi
            echo "Waiting for container (${attempt}/30)..."
            sleep 2
          done

          echo "Container did not become healthy."
          docker logs prompt2music-vercel
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs prompt2music-vercel || true

      - name: Stop container
        if: always()
        run: docker stop prompt2music-vercel || true
